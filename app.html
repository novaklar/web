<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Apps | Novaklar</title>

  <!-- Forzar recarga de la última versión -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="version" content="2026-10-10-4" />

  <style>
    @font-face {
      font-family: 'Poppins';
      font-weight: 700;
      src: url('https://raw.githubusercontent.com/novaklar/web/main/Poppins-Bold.ttf?v=2026-10-10-4') format('truetype');
      font-display: swap;
    }
    @font-face {
      font-family: 'Poppins';
      font-weight: 400;
      src: url('https://raw.githubusercontent.com/novaklar/web/main/Poppins-Regular.ttf?v=2026-10-10-4') format('truetype');
      font-display: swap;
    }
    @font-face {
      font-family: 'Poppins';
      font-weight: 500;
      src: url('https://raw.githubusercontent.com/novaklar/web/main/Poppins-Medium.ttf?v=2026-10-10-4') format('truetype');
      font-display: swap;
    }
  </style>

  <link href="https://fonts.googleapis.com/css2?family=Comme:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    body {
      margin: 0;
      font-family: 'Poppins', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #ffffff; /* Fondo blanco */
      color: #080a33;
      padding-top: 2rem;
      cursor: default;
    }

    .top-controls {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0 1.5rem 2rem;
      max-width: 800px;
      margin: 0 auto;
    }

    .logo-container {
      margin-bottom: 2rem;
      text-align: center;
    }

    .logo-container img {
      height: 80px;
      width: auto;
      filter: brightness(0);
    }

    .controls-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      width: 100%;
      max-width: 550px;
      margin: 0 auto;
    }

    /* Botón Regresar - negro */
    .btn-back {
      padding: 0.7rem 2rem;
      border-radius: 0.5rem;
      font-weight: 500;
      font-size: 1rem;
      cursor: pointer;
      text-decoration: none;
      text-align: center;
      transition: all 0.2s ease;
      font-family: 'Poppins', sans-serif;
      min-height: 48px;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
      background-color: transparent;
      color: #000000; /* Negro */
      border: 2px solid #000000; /* Negro */
      width: 140px;
    }

    .btn-back:hover {
      background-color: rgba(0, 0, 0, 0.08);
    }

    /* Botones segmentados - negros */
    .mode-segmented {
      display: flex;
      gap: 0;
      width: 280px;
      height: 52px;
      border: 2px solid #000000; /* Negro */
      border-radius: 0.5rem;
      overflow: hidden;
      background-color: transparent;
    }

    .mode-segmented-btn {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 500;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s ease;
      color: #000000; /* Negro */
      background-color: transparent;
      border: none;
      font-family: 'Poppins', sans-serif;
      height: 100%;
      padding: 0;
    }

    .mode-segmented-btn:first-child {
      border-right: 2px solid #000000; /* Negro */
    }

    .mode-segmented-btn.active {
      background-color: #000000; /* Negro */
      color: #ffffff;
      font-weight: 500;
    }

    /* Cabeceras de las tablas - peso semibold */
    .table-container thead tr th {
      padding: 0.5rem 1rem;
      text-align: center;
      font-weight: 600;
      color: #ffffff;
    }

    .table-container thead tr:first-child th {
      padding-top: 0.6rem;
      border-top-left-radius: 0.6rem;
      border-top-right-radius: 0.6rem;
      overflow: hidden;
    }

    .table-container thead:not(:first-child) tr th {
      border-radius: 0 !important;
    }

    .table-container td {
      padding: 0.5rem 1rem;
      border-bottom: 1px solid #e2e8f0;
      color: #080a33;
      font-weight: 400;
    }

    .table-container tr:last-child td {
      border-bottom: none;
    }

    .promotor-highlight {
      background-color: #f0f7ff;
    }
    
    .promotor-highlight td:first-child {
      color: #080a33;
      font-weight: 500;
    }

    .promotor-highlight td:last-child {
      color: #080a33;
      font-size: 1.1rem;
      font-weight: 600;
    }

    .container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1.8rem;
      padding: 1.5rem;
      justify-content: center;
      max-width: 1200px;
      margin: 0 auto;
    }

    .card {
      background-color: transparent;
      border: none;
      padding: 0;
      cursor: pointer;
      transition: transform 0.2s ease;
      width: 300px;
      margin: 0 auto;
    }

    .card img {
      width: 300px;
      height: 130px;
      object-fit: cover;
      border-radius: 0.6rem;
      transition: transform 0.3s ease;
      display: block;
      box-shadow: 0 3px 10px rgba(0,0,0,0.15);
    }

    .card:hover img {
      transform: scale(1.05);
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    }

    .table-container {
      display: none;
      margin-top: 0.8rem;
      background-color: #ffffff; /* Fondo blanco también para tablas */
      border-radius: 0.6rem;
      overflow: hidden;
      box-shadow: 0 3px 10px rgba(0,0,0,0.1);
      border: 1px solid #e2e8f0;
      width: 100%;
      position: relative;
      z-index: 10;
    }

    .table-container table {
      width: 100%;
      color: #080a33;
      border-collapse: collapse;
      font-size: 0.9rem;
    }

    .whatsapp-button {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 60px; 
      height: 60px;
      border-radius: 15px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      z-index: 1000;
      text-decoration: none;
      transition: all 0.3s ease;
      background-color: #04d749;
      border: none;
      outline: none;
      padding: 0;
      box-shadow: 0 4px 12px rgba(4, 215, 73, 0.3);
    }

    .whatsapp-button:hover {
      background-color: #04c043;
      transform: scale(1.1);
      box-shadow: 0 6px 16px rgba(4, 215, 73, 0.4);
    }

    .whatsapp-button:active,
    .whatsapp-button:focus {
      background-color: #04c043;
      outline: none;
      box-shadow: 0 4px 12px rgba(4, 215, 73, 0.3);
    }

    .whatsapp-icon-container {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 14px;
    }

    .whatsapp-icon-container img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: brightness(0) invert(1);
    }

    @media (max-width: 768px) {
      body {
        padding-top: 1.5rem;
      }
      
      .top-controls {
        padding: 0 1rem 1.5rem;
      }
      
      .logo-container {
        margin-bottom: 1.5rem;
      }
      
      .logo-container img {
        height: 70px;
      }
      
      .controls-row {
        flex-direction: column;
        gap: 1rem;
        width: 100%;
      }
      
      .btn-back {
        width: 100%;
        max-width: 300px;
      }
      
      .mode-segmented {
        width: 100%;
        max-width: 300px;
      }

      .whatsapp-button {
        width: 55px;
        height: 55px;
        border-radius: 14px;
        bottom: 20px;
        right: 20px;
      }

      .whatsapp-icon-container {
        padding: 13px;
      }
    }

    @media (max-width: 600px) {
      .logo-container img {
        height: 65px;
      }
      
      .btn-back, .mode-segmented {
        max-width: 280px;
      }
      
      .container {
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 1.5rem;
        padding: 1rem;
      }
      
      .card {
        width: 280px;
      }
      
      .card img {
        width: 280px;
      }

      .whatsapp-button {
        width: 50px;
        height: 50px;
        border-radius: 13px;
        bottom: 15px;
        right: 15px;
      }

      .whatsapp-icon-container {
        padding: 12px;
      }
    }

    @media (max-width: 400px) {
      body {
        padding-top: 1rem;
      }
      
      .top-controls {
        padding: 0 1rem 1rem;
      }
      
      .logo-container img {
        height: 60px;
      }
      
      .btn-back, .mode-segmented {
        max-width: 260px;
      }
      
      .container {
        grid-template-columns: 1fr;
      }
      
      .card {
        width: 100%;
        max-width: 300px;
      }
      
      .card img {
        width: 100%;
        max-width: 300px;
      }

      .whatsapp-button {
        width: 45px;
        height: 45px;
        border-radius: 11px;
        bottom: 10px;
        right: 10px;
      }

      .whatsapp-icon-container {
        padding: 10px;
      }
    }
  </style>
</head>
<body>
  <div class="top-controls">
    <div class="logo-container">
      <img src="https://raw.githubusercontent.com/novaklar/web/refs/heads/main/Logos/novaklar.svg?v=2026-10-10-4" alt="Novaklar Logo" />
    </div>
    
    <div class="controls-row">
      <a href="https://novaklar.github.io/web/" class="btn-back">Regresar</a>
      
      <div class="mode-segmented" id="modeSegmented">
        <button class="mode-segmented-btn active" id="segmentedPromotor">Promotor</button>
        <button class="mode-segmented-btn" id="segmentedRevendedor">Revendedor</button>
      </div>
    </div>
  </div>

  <div class="container" id="cards-container"></div>

  <!-- WhatsApp Button -->
  <a href="CR.html" target="_blank" class="whatsapp-button" aria-label="Chat WhatsApp">
    <div class="whatsapp-icon-container">
      <img src="https://raw.githubusercontent.com/novaklar/web/refs/heads/main/extra/whatsapp.svg?v=2026-10-10-4" alt="WhatsApp">
    </div>
  </a>

  <script>
    const VERSION = '2026-10-10-4'; // Versión para forzar recarga

    const container = document.getElementById('cards-container');
    let currentlyOpenCard = null;
    let currentMode = 'promotor';

    const popularityOrder = [
      "geminy.png",
      "gpt.png",
      "canva.png",
      "capcut.png",
      "duo.png"
    ];

    const servicios = [
      { 
        nombre: "gemini", 
        displayName: "Gemini",
        imageName: "geminy.png",
        headerBg: "#000000",
        valores: [
          { tipo: "Plan 2 Meses", real: 15000, afiliado: 19000, sugerido: 26000 },
          { tipo: "Plan 18 Meses", real: 30000, afiliado: 40000, sugerido: 55000 }
        ]
      },
      { 
        nombre: "gpt", 
        displayName: "ChatGPT",
        imageName: "gpt.png",
        headerBg: "#10a37f",
        sinStock: true,
        mensaje: "Sin stock"
      },
      { 
        nombre: "canva", 
        displayName: "Canva",
        imageName: "canva.png",
        headerBg: "linear-gradient(135deg, #03bfcd, #7a2ee7)",
        valores: [
          { tipo: "Plan 1 Mes", real: 5000, afiliado: 9000, sugerido: 13000 },
          { tipo: "Plan 1 Año", real: 15000, afiliado: 28000, sugerido: 38000 }
        ]
      },
      { 
        nombre: "capcut", 
        displayName: "CapCut",
        imageName: "capcut.png",
        headerBg: "#000000",
        valores: [
          { tipo: "Plan 1 Mes", real: 10000, afiliado: 14000, sugerido: 18000 }
        ]
      },
      { 
        nombre: "duo", 
        displayName: "Duolingo",
        imageName: "duo.png",
        headerBg: "#58cc02",
        valores: [
          { tipo: "Plan Anual · 12 Meses", real: 10000, afiliado: 20000, sugerido: 20000 }
        ]
      }
    ];

    // Ordenar según popularidad
    servicios.sort((a, b) => {
      return popularityOrder.indexOf(a.imageName) - popularityOrder.indexOf(b.imageName);
    });

    function calcularGananciaPromotor(precioReal, precioSugerido) {
      const diferencia = precioSugerido - precioReal;
      return Math.round(diferencia * 0.60);
    }

    function formatoPrecio(valor) {
      return '$' + valor.toLocaleString('es-CO');
    }

    function celdaValor(valor) {
      const estilo = valor < 0 ? ' style="color:#dc2626; font-weight:600;"' : '';
      return `<td${estilo}>${formatoPrecio(valor)}</td>`;
    }

    function crearTarjeta(servicio, modo = 'promotor') {
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.nombre = servicio.nombre;
      card.dataset.popularity = popularityOrder.indexOf(servicio.imageName);
      
      const rutaImagen = `https://raw.githubusercontent.com/novaklar/web/refs/heads/main/nkc/${servicio.imageName}?v=${VERSION}`;
      
      const headerStyle = `background:${servicio.headerBg}; color:#ffffff;`;
      
      let tableHTML = `
        <div class="table-container">
          <table>`;
      
      if (servicio.sinStock) {
        // Caso sin stock (ChatGPT)
        tableHTML += `
          <thead>
            <tr><th colspan="2" style="${headerStyle}">${servicio.displayName}</th></tr>
          </thead>
          <tbody>
            <tr><td colspan="2" style="text-align:center; padding:1rem; font-weight:600; color:#dc2626;">${servicio.mensaje}</td></tr>
          </tbody>`;
      } else {
        servicio.valores.forEach((valor) => {
          const headerText = valor.tipo ? valor.tipo : servicio.displayName;
          
          tableHTML += `
            <thead>
              <tr><th colspan="2" style="${headerStyle}">${headerText}</th></tr>
            </thead>
            <tbody>`;
          
          if (modo === 'revendedor') {
            const ganancia = valor.sugerido - valor.afiliado;
            tableHTML += `
              <tr><td>Precio Afiliado</td><td>${formatoPrecio(valor.afiliado)}</td></tr>
              <tr><td>Precio Sugerido</td><td>${formatoPrecio(valor.sugerido)}</td></tr>
              <tr><td>Ganancia</td>${celdaValor(ganancia)}</tr>
            `;
          } else {
            const gananciaPromotor = calcularGananciaPromotor(valor.real, valor.sugerido);
            tableHTML += `
              <tr class="promotor-highlight">
                <td>Ganancia Promotor</td>
                ${celdaValor(gananciaPromotor)}
              </tr>
            `;
          }
          
          tableHTML += `</tbody>`;
        });
      }
      
      tableHTML += `</table></div>`;
      
      card.innerHTML = `
        <img src="${rutaImagen}" alt="${servicio.displayName}" />
        ${tableHTML}
      `;
      
      const tableContainer = card.querySelector('.table-container');
      
      card.addEventListener('click', (e) => {
        if (e.target.tagName === 'IMG' && tableContainer.style.display === 'block') return;
        
        if (currentlyOpenCard && currentlyOpenCard !== tableContainer) {
          currentlyOpenCard.style.display = 'none';
        }
        
        tableContainer.style.display = tableContainer.style.display === 'block' ? 'none' : 'block';
        
        currentlyOpenCard = tableContainer.style.display === 'block' ? tableContainer : null;
      });
      
      return card;
    }

    function setupClickOutsideListener() {
      document.addEventListener('click', function(e) {
        if (currentlyOpenCard) {
          const card = currentlyOpenCard.closest('.card');
          if (!card.contains(e.target)) {
            currentlyOpenCard.style.display = 'none';
            currentlyOpenCard = null;
          }
        }
      });
    }

    function renderAllCards(modo) {
      container.innerHTML = '';
      
      servicios.forEach((servicio) => {
        container.appendChild(crearTarjeta(servicio, modo));
      });
    }

    setupClickOutsideListener();

    const promotorBtn = document.getElementById('segmentedPromotor');
    const revendedorBtn = document.getElementById('segmentedRevendedor');

    function setMode(mode) {
      currentMode = mode;
      if (mode === 'revendedor') {
        revendedorBtn.classList.add('active');
        promotorBtn.classList.remove('active');
      } else {
        revendedorBtn.classList.remove('active');
        promotorBtn.classList.add('active');
      }
      renderAllCards(mode);
    }

    promotorBtn.addEventListener('click', () => setMode('promotor'));
    revendedorBtn.addEventListener('click', () => setMode('revendedor'));

    renderAllCards('promotor');
  </script>
</body>
</html>
